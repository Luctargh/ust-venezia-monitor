name: UST Venezia Monitor

on:
  schedule:
    - cron: "*/30 6-18 * * *"
  workflow_dispatch:

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download news page
        run: |
          curl -s https://venezia.istruzioneveneto.gov.it/notizie > page.html

      # 1️⃣ Estrai TUTTI i link delle notizie ATA
      - name: Extract ATA news links
        run: |
          grep -oP '(?<=href=")/notizie/.*?(?=")' page.html | grep -i "ata" > links.txt
          cat links.txt

      # 2️⃣ Confronta con latest.txt e trova TUTTE le nuove notizie
      - name: Detect new ATA news
        run: |
          NEW_LINKS=""
          while read -r LINK; do
            if ! grep -q "$LINK" latest.txt; then
              NEW_LINKS="$NEW_LINKS $LINK"
            fi
          done < links.txt

          if [ -n "$NEW_LINKS" ]; then
            echo "NEW_NEWS=true" >> $GITHUB_ENV
            echo "NEW_LINKS=$NEW_LINKS" >> $GITHUB_ENV
          else
            echo "NEW_NEWS=false" >> $GITHUB_ENV
          fi

      # 3️⃣ Per ogni nuova notizia: scarica la pagina e estrai titolo + descrizione
      - name: Extract title and description for each news
        if: env.NEW_NEWS == 'true'
        run: |
          mkdir newsdata
          for LINK in $NEW_LINKS; do
            FULL="https://venezia.istruzioneveneto.gov.it$LINK"
            FILE="newsdata/$(echo $LINK | tr '/' '_').html"

            curl -s "$FULL" > "$FILE"

            TITLE=$(grep -oP '(?<=<h1 class="entry-title">).*?(?=</h1>)' "$FILE" | head -n 1)
            DESC=$(grep -oP '(?<=<p>).*?(?=</p>)' "$FILE" | head -n 1)

            echo "$LINK|$TITLE|$DESC" >> newsdata/extracted.txt
          done

      # 4️⃣ Invia EMAIL Outlook per ogni notizia ATA
      - name: Send Outlook email
        if: env.NEW_NEWS == 'true'
        uses: dawidd6/send-email@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          username: ${{ secrets.OUTLOOK_USERNAME }}
          password: ${{ secrets.OUTLOOK_PASSWORD }}
          subject: "UST Venezia – Nuova notizia ATA"
          to: ${{ secrets.OUTLOOK_TO }}
          content_type: text/html
          body: |
            <h2>Nuove notizie ATA pubblicate</h2>
            <ul>
            $(
              while IFS="|" read -r LINK TITLE DESC; do
                echo "<li><b>$TITLE</b><br>$DESC<br><a href='https://venezia.istruzioneveneto.gov.it$LINK'>Apri notizia</a></li>"
              done < newsdata/extracted.txt
            )
            </ul>

      # 5️⃣ Invia NOTIFICA Telegram per ogni notizia ATA
      - name: Send Telegram notifications
        if: env.NEW_NEWS == 'true'
        run: |
          while IFS="|" read
