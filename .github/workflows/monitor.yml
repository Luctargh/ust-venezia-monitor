name: UST Venezia Monitor ATA

on:
  schedule:
    - cron: "*/30 6-18 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # 1️⃣ Scarica tutte le pagine che contengono ATA
      - name: Download ATA categories
        run: |
          mkdir pages
          curl -s https://venezia.istruzioneveneto.gov.it/personale-ata > pages/ata.html
          curl -s https://venezia.istruzioneveneto.gov.it/utilizzazioni-assegnazioni-provvisorie > pages/uap.html
          curl -s https://venezia.istruzioneveneto.gov.it/avvisi > pages/avvisi.html
          curl -s https://venezia.istruzioneveneto.gov.it/organico > pages/organico.html
          curl -s https://venezia.istruzioneveneto.gov.it/comunicazioni > pages/comunicazioni.html
          curl -s https://venezia.istruzioneveneto.gov.it/notizie > pages/notizie.html

      # 2️⃣ Estrai TUTTI i link delle notizie ATA
      - name: Extract all news links
        run: |
          > links.txt
          for FILE in pages/*.html; do
            grep -oP '(?<=href=")/notizie/.*?(?=")' "$FILE" >> links.txt || true
          done
          sort -u links.txt -o links.txt

      # 3️⃣ Estrai titolo + data completa + descrizione
      - name: Extract full data
        run: |
          mkdir newsdata
          > newsdata/all.txt

          for LINK in $(cat links.txt); do
            FULL="https://venezia.istruzioneveneto.gov.it$LINK"
            FILE="newsdata/$(echo $LINK | tr '/' '_').html"

            curl -s "$FULL" > "$FILE"

            TITLE=$(grep -oP '(?<=<h1 class="entry-title">).*?(?=</h1>)' "$FILE" | head -n 1)
            DATETIME=$(grep -oP '(?<=datetime=").*?(?=")' "$FILE" | head -n 1)
            DESC=$(grep -oP '(?<=<p>).*?(?=</p>)' "$FILE" | head -n 1)

            echo "$LINK|$TITLE|$DATETIME|$DESC" >> newsdata/all.txt
          done

      # 4️⃣ Filtra SOLO le notizie ATA dal titolo
      - name: Filter ATA
        run: |
          > newsdata/ata.txt
          while IFS="|" read -r LINK TITLE DATETIME DESC; do
            echo "$TITLE" | grep -Ei "a\.?t\.?a" >/dev/null && \
              echo "$LINK|$TITLE|$DATETIME|$DESC" >> newsdata/ata.txt
          done < newsdata/all.txt

      # 5️⃣ Confronta DATA+ORA+LINK con latest_seen.txt
      - name: Detect new ATA news
        run: |
          if [ ! -f latest_seen.txt ]; then
            touch latest_seen.txt
          fi

          > newsdata/new.txt

          while IFS="|" read -r LINK TITLE DATETIME DESC; do
            KEY="$DATETIME|$LINK"
            if ! grep -q "$KEY" latest_seen.txt; then
              echo "$LINK|$TITLE|$DATETIME|$DESC" >> newsdata/new.txt
              echo "$KEY" >> latest_seen.txt
            fi
          done < newsdata/ata.txt

          if [ -s newsdata/new.txt ]; then
            echo "NEW_NEWS=true" >> $GITHUB_ENV
          else
            echo "NEW_NEWS=false" >> $GITHUB_ENV
          fi

      # 6️⃣ Invia Telegram
      - name: Send Telegram notifications
        if: env.NEW_NEWS == 'true'
        run: |
          while IFS="|" read -r LINK TITLE DATETIME DESC; do
            FULL="https://venezia.istruzioneveneto.gov.it$LINK"
            MESSAGE="🆕 *Nuova notizia ATA!*\n\n📅 *Data:* $DATETIME\n📌 *Titolo:* $TITLE\n📝 *Descrizione:* $DESC\n🔗 $FULL"
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
              -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
              -d text="$MESSAGE" \
              -d parse_mode="Markdown"
          done < newsdata/new.txt

      - name: Commit latest_seen.txt
        if: env.NEW_NEWS == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add latest_seen.txt
          git commit -m "Update seen ATA news"
          git push
