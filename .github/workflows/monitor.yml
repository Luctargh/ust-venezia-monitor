name: UST Venezia – Monitor ATA via API JSON

on:
  schedule:
    - cron: "*/30 6-18 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # 1️⃣ Scarica le pubblicazioni via API JSON
      - name: Download API JSON
        run: |
          curl -s "https://venezia.istruzioneveneto.gov.it/wp-json/wp/v2/posts?per_page=100" > api.json

      # 2️⃣ Estrai solo le pubblicazioni ATA
      - name: Filter ATA posts
        run: |
          mkdir newsdata
          > newsdata/ata.txt

          # Estrai: titolo, data, link, contenuto
          jq -r '.[] | "\(.title.rendered)|\(.date)|\(.link)|\(.content.rendered)"' api.json \
            | grep -Ei "a\.?t\.?a" \
            > newsdata/ata.txt

      # 3️⃣ Confronta DATA+LINK con latest_seen.txt
      - name: Detect new ATA news
        run: |
          if [ ! -f latest_seen.txt ]; then
            touch latest_seen.txt
          fi

          > newsdata/new.txt

          while IFS="|" read -r TITLE DATE LINK CONTENT; do
            KEY="$DATE|$LINK"
            if ! grep -q "$KEY" latest_seen.txt; then
              echo "$TITLE|$DATE|$LINK|$CONTENT" >> newsdata/new.txt
              echo "$KEY" >> latest_seen.txt
            fi
          done < newsdata/ata.txt

          if [ -s newsdata/new.txt ]; then
            echo "NEW_NEWS=true" >> $GITHUB_ENV
          else
            echo "NEW_NEWS=false" >> $GITHUB_ENV
          fi

      # 4️⃣ Invia Telegram
      - name: Send Telegram notifications
        if: env.NEW_NEWS == 'true'
        run: |
          while IFS="|" read -r TITLE DATE LINK CONTENT; do
            MESSAGE="🆕 *Nuova notizia ATA!*\n\n📅 *Data:* $DATE\n📌 *Titolo:* $TITLE\n🔗 $LINK"
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
              -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
              -d text="$MESSAGE" \
              -d parse_mode="Markdown"
          done < newsdata/new.txt
   
      - name: Send Telegram NO-NEWS notification
        if: env.NEW_NEWS == 'false'
        run: |
          MESSAGE="ℹ️ Nessuna nuova notizia ATA."
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$MESSAGE"

      - name: Commit latest_seen.txt
        if: env.NEW_NEWS == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add latest_seen.txt
          git commit -m "Update seen ATA news"
          git push
