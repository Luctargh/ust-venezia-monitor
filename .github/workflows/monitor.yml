name: Monitor UST Venezia ATA

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Restore last seen link from cache
      id: cache-last
      uses: actions/cache@v3
      with:
        path: last_seen.txt
        key: last-seen-key

    - name: Fetch UST Venezia page
      run: |
        curl -s https://venezia.istruzioneveneto.gov.it/notizie/ > page.html

    - name: Extract latest news link
      run: |
        LINK=$(grep -oP '(?<=href=")[^"]+' page.html | grep '/notizie/' | head -n 1)
        echo "LATEST_LINK=$LINK" >> $GITHUB_ENV

    - name: Load last seen link
      run: |
        if [ -f last_seen.txt ]; then
          LAST=$(cat last_seen.txt)
        else
          LAST=""
        fi
        echo "LAST_SEEN=$LAST" >> $GITHUB_ENV

    - name: Compare links
      run: |
        if [ "$LATEST_LINK" != "$LAST_SEEN" ]; then
          echo "NEW_NEWS=true" >> $GITHUB_ENV
        else
          echo "NEW_NEWS=false" >> $GITHUB_ENV
        fi

    - name: Send Telegram notification
      if: env.NEW_NEWS == 'true'
      run: |
        MESSAGE="Nuova notizia ATA pubblicata:\nhttps://venezia.istruzioneveneto.gov.it$LATEST_LINK"
        curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="$MESSAGE"

    - name: Send Email notification (Gmail)
      if: env.NEW_NEWS == 'true'
      run: |
        SUBJECT="Nuova notizia ATA pubblicata"
        BODY="È stata pubblicata una nuova notizia ATA:\nhttps://venezia.istruzioneveneto.gov.it$LATEST_LINK"

        curl -s --url "smtps://smtp.gmail.com:465" \
          --ssl-reqd \
          --user "${{ secrets.EMAIL_USERNAME }}:${{ secrets.EMAIL_PASSWORD }}" \
          --mail-from "${{ secrets.EMAIL_USERNAME }}" \
          --mail-rcpt "${{ secrets.EMAIL_USERNAME }}" \
          -T <(echo -e "Subject: $SUBJECT\n\n$BODY")

    - name: Save latest link to cache
      if: env.NEW_NEWS == 'true'
      run: |
        echo "$LATEST_LINK" > last_seen.txt
